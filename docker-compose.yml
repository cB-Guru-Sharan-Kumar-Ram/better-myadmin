# BetterMyAdmin with a MySQL server: `docker compose up -d`, then http://localhost:8080
# (log in as root / example, or any account of the server).
#
# The phpMyAdmin image's variables work as they do there; a compose file written for
# `phpmyadmin:latest` runs with `build: .` (or the BetterMyAdmin image) in its place.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: example
    volumes:
      - db-data:/var/lib/mysql

  bettermyadmin:
    build: .
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      # the server to log in to (the image's default is the linked `db`, as in phpMyAdmin's image)
      BMA_HOST: db
      BMA_PORT: "3306"
      # BMA_ARBITRARY_SERVER: "1"   # let the login form name any server
      # BMA_USER: root              # config authentication: no login form
      # BMA_PASSWORD_FILE: /run/secrets/db_password
      # BMA_ABSOLUTE_URI: https://example.org/bettermyadmin/
      BMA_UPLOAD_LIMIT: 64M
      # any directive: BMA__<Directive>[__<Sub>], e.g. BMA__MaxRows: "50"
    volumes:
      # sessions, the generated blowfish_secret, the local metadata store
      - bma-data:/var/lib/bettermyadmin
      # your own configuration file (it overrides the variables above):
      # - ./bettermyadmin.config.ts:/etc/bettermyadmin/bettermyadmin.config.ts:ro

volumes:
  db-data:
  bma-data:
