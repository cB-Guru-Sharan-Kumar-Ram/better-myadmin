rules:
  - pma: { kind: checkbox, name: LoginCookieValidityDisableWarning }
    exception: X57
    reason: the warning about PHP's session.gc_maxlifetime is never shown (X44), so its switch is not offered
  - pma: { kind: link, label: Documentation }
    exception: X57
    reason: the documentation link of a setting that is not offered (LoginCookieValidityDisableWarning / PersistentConnections)
  - pma: { kind: checkbox, label: Allow users to customize this value }
    exception: X57
    reason: >-
      the "allow users to customize" box of the LoginCookieValidityDisableWarning row (identical
      labels, so the report names the next row's)
