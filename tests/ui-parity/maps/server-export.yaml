# Intentional differences of the export form (see tests/ui-parity/README.md for the format).
rules:
  - match: { kind: button, label: Export }
    ignore: [section]
    reason: >-
      the submit row follows the last card in both apps; our card titles are h2 headings (Panel),
      phpMyAdmin's are plain div.card-header, so the preceding-heading fallback names a different section
  - match: { kind: select, label: Databases, section: Databases }
    ignore: [options, value]
    reason: >-
      environment: the list holds every database of the shared MySQL; suites running concurrently
      create and drop theirs between the two captures
  - match: { kind: select, label: File format to export }
    ignore: [options]
    exception: X57
    reason: >-
      phpMyAdmin's "PHP array" format is our "JavaScript module"; ours also lists PDF, which the
      reference built without TCPDF does not (ExportPdf::isAvailable); the rest of the list is the same
  - match: { kind: select, label: File format to export, step: format PHP array }
    ignore: [value]
    exception: X57
    reason: phparray there, jsmodule here
