# Intentional differences of the home page (see tests/ui-parity/README.md for the format).
rules:
  - ours: { kind: select, name: lang }
    added: >-
      environment: the reference phpMyAdmin is built without translations (docker/pma-ref,
      PMA_TRANSLATIONS=0), so it hides the language selector; ours bundles them
  - ours: { kind: select, label: Color mode for the theme }
    added: every theme has a dark variant, so the colour-mode select is always shown
    exception: X31
  - pma: { kind: link, label: GitHub, section: phpMyAdmin }
    n/a: environment — the reference runs from a git checkout (ShowGitRevision prints branch and commit links)
  - pma: { kind: link, label: Maurício Meneghini Fauth, section: phpMyAdmin }
    n/a: environment — the git revision line names the reference commit's author
  - match: { kind: link, label: Documentation, section: Web server }
    ignore: [section]
    reason: >-
      the Web server card lists 4 PHP-extension documentation links in phpMyAdmin and 3 Node.js module
      links in ours (X30); the 4th pairs with our language selector's documentation link (faq7-2), which
      the reference hides together with the selector (built without translations, see the lang rule)
    exception: X30
