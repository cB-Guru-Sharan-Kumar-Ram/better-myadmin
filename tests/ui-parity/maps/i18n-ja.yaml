# Intentional differences of the translated cases (tests/ui-parity/i18n.uip.ts): those of the English
# cases (home.yaml, table-insert.yaml…), with their labels in this language where a rule names one.
rules:
  - match: { kind: select, name: set_theme }
    ignore: [options]
    reason: the theme list has BetterMyAdmin's optional modern theme besides phpMyAdmin's four
    exception: X53
  - ours: { kind: button, label: '...' }
    added: >-
      the calendar trigger of date/time fields is a focusable button (phpMyAdmin's jQuery UI
      datepicker adds an <img> trigger that the harness does not count as a control)
  # db-structure row checkboxes (as in the English db-structure.yaml): phpMyAdmin's selected_tbl[]
  # has no accessible name, ours labels each with its table name (the uip_ fixture tables)
  - pma: { kind: checkbox, name: 'selected_tbl[]' }
    n/a: matched by ours below — phpMyAdmin's row checkbox has no accessible name, only its name attr
  - ours: { kind: checkbox, label: '/^uip_/' }
    added: the database-structure row checkbox (selected_tbl[]) labelled with its table name
  # phpMyAdmin's VersionCheck link on the home card (a version number); BetterMyAdmin runs no check
  - pma: { kind: link, label: '/^\d+\.\d+\.\d+$/', section: phpMyAdmin }
    n/a: phpMyAdmin's VersionCheck widget links the latest release; BetterMyAdmin runs no such check
  - ours: { kind: select, name: themeColorMode }
    added: every theme has a dark variant, so the colour-mode select is always shown
    exception: X31
  - pma: { kind: link, label: 'ドキュメント', section: 'ウェブサーバ' }
    n/a: >-
      the Web server card lists 4 PHP-extension documentation links in phpMyAdmin and 3 Node.js
      module links in ours
    exception: X30
