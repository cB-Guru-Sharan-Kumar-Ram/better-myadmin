# Accepted exceptions to `pnpm conventions:check` (docs/architecture/16-golden-path.md).
# Every entry needs a reason. The list only shrinks: an entry that no longer matches fails the check.
# Fields: rule (required), file (exact path, optional), symbol (exact, optional), reason (required).
allow:
  - rule: no-duplicate-exports
    symbol: expandUserString
    reason: >-
      same purpose, different runtime: the web title expands client-side variables only, the server one queries @VSERVER@/@VERSION@ through the connection; follow-up: one pure expander in packages/config with an async variable resolver
  - rule: no-duplicate-exports
    symbol: str
    reason: >-
      different purpose: packages/config `str()` declares a string config node, sql-lexer `str()` is PHP (string) casting
  - rule: no-duplicate-exports
    symbol: phpFloatToString
    reason: >-
      PHP emulation: packages/sql-lexer must stay dependency-free (it runs in the lint worker), so it keeps its own copy; i18n / mysql-types / kbs variants differ in signature (byte arrays, trim char lists, precision) — follow-up: a dependency-free packages/php owner that sql-lexer, i18n, mysql-types and kbs import
  - rule: no-duplicate-exports
    symbol: phpFloatval
    reason: >-
      PHP emulation: packages/sql-lexer must stay dependency-free (it runs in the lint worker), so it keeps its own copy; i18n / mysql-types / kbs variants differ in signature (byte arrays, trim char lists, precision) — follow-up: a dependency-free packages/php owner that sql-lexer, i18n, mysql-types and kbs import
