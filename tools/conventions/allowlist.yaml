  - rule: web/no-hand-made-ui
    file: apps/web/src/features/console/Console.tsx
    reason: >-
      the console drawer's `.toolbar` rows (Options, Bookmarks, Add bookmark,
      debug) mirror phpMyAdmin's console widget
      (resources/templates/console/display.twig), not a card header; a
      Console-specific toolbar primitive is due when the console is reworked
  - rule: web/no-hand-made-ui
    file: apps/web/src/features/sql/SqlMessage.tsx
    reason: >-
      ErrorCard is Generator::mysqlDie (heading, static analysis list,
      highlighted SQL with Copy and documentation links) composed inside
      SqlMessage; MessageBox carries only text + plain SQL
