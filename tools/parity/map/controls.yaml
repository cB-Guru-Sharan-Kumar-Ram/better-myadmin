# Dispositions for phpMyAdmin template controls our web app does not claim (yet). Claims live next to
# the components (`pma-controls.ts` registries, `data-pma` attributes; docs/architecture/12).
# Keys: control key (`login/form.twig#pma_username`), template (`login/form.twig`) or a template
# directory prefix ending in `/`.
#   planned: M<n> | exception: X<n> | n/a: <reason> | note: <text>

setup/:
  exception: X7
  planned: M4
  note: first-run wizard instead of public/setup
setup/home/index.twig#link:Donate:
  exception: X44
  note: no Donate link in the setup script's footer
home/index.twig#link:Show PHP information:
  exception: X15
  note: '"Show runtime information" (HomePage.tsx) opens the runtime information page'
home/index.twig#link:Get more themes!:
  exception: X30
  note: phpMyAdmin's CSS themes cannot be loaded; the themes ship with the client (X16)
user_password.twig#link:Back:
  n/a: 'rendered only when the change-password form is posted without JavaScript (UserPasswordController non-AJAX branch); the SPA always takes the AJAX path, whose result shows in the dialog and the page message'
database/routines/editor_form.twig#routine_changetype:
  n/a: 'rendered only without JavaScript (is_ajax false): the AJAX editor has the item_type select instead (RoutinesPage.tsx)'
database/routines/editor_form.twig#routine_removeparameter:
  n/a: 'rendered only without JavaScript (is_ajax false): the AJAX editor removes a parameter with its Drop link (RoutinesPage.tsx)'
database/routines/editor_form.twig#submit:Go:
  n/a: 'rendered only without JavaScript (is_ajax false): the AJAX editor posts editor_process_* as a hidden field from the modal''s Go (#routinesEditorModalSaveButton)'
database/routines/execute_form.twig#execute_routine:
  n/a: 'rendered only without JavaScript (ajax false): the AJAX form posts execute_routine as a hidden field from the modal''s Go (#routinesExecuteModalExecuteButton)'
events/editor-form.twig#editor_process_*:
  n/a: 'rendered only without JavaScript (is_ajax false): the AJAX editor posts editor_process_* as a hidden field from the modal''s Go (#eventsEditorModalSaveButton)'
