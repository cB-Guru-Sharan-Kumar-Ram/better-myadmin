# Dispositions for phpMyAdmin JavaScript behaviours (tools/parity/inventory/js.json) our web app does
# not claim (yet). Claims live next to the components: `js:<script>#…` keys in `pma-controls.ts`
# registries (docs/architecture/12), e.g.
#   'js:modules/console.ts#keydown:#pma_console .console_query_input': { file: 'Console.tsx', match: 'onKeyDown' },
# Keys: item key, a script (`js:table/structure.ts`) or a prefix ending in `/` or `*` (`js:setup/`).
#   planned: M<n> | exception: X<n> | n/a: <reason> | note: <text>

js:modules/ajax.ts#click:#pma_ignore_errors_bottom:
  n/a: 'PHP errors of the request (#pma_errors, ErrorHandler::getDispErrors): the Node server raises no PHP errors to show or report'
js:modules/ajax.ts#click:#pma_ignore_all_errors_bottom:
  n/a: 'PHP errors of the request (see #pma_ignore_errors_bottom)'
js:modules/ajax.ts#click:#pma_ignore_errors_popup:
  n/a: 'PHP errors of the request (see #pma_ignore_errors_bottom)'
js:modules/ajax.ts#click:#pma_ignore_all_errors_popup:
  n/a: 'PHP errors of the request (see #pma_ignore_errors_bottom)'
js:modules/ajax.ts#click:<$pageContent> form input[type=submit]:
  n/a: 'records the clicked submit button as a hidden field for the serialized AJAX form post; each button of a React form calls its own action'
js:server/privileges.ts#change:#checkbox_SSL_priv:
  n/a: 'dead handler: no template renders #checkbox_SSL_priv (the SSL radios are handled by input[name="ssl_type"])'
js:modules/console.ts#click:<$targetMessage> .action.dbg_show_trace:
  n/a: 'Debug SQL backtraces: $cfg[''DBG''][''sql''] logs a PHP call stack per statement; the Node server has no PHP backtrace to show'
js:modules/console.ts#click:<$targetMessage> .action.dbg_hide_trace:
  n/a: 'Debug SQL backtraces: no PHP call stack (see dbg_show_trace)'
js:modules/console.ts#click:<$targetMessage> .action.dbg_show_args:
  n/a: 'Debug SQL backtraces: the arguments of the PHP stack frames (see dbg_show_trace)'
js:modules/console.ts#click:<$targetMessage> .action.dbg_hide_args:
  n/a: 'Debug SQL backtraces: the arguments of the PHP stack frames (see dbg_show_trace)'
