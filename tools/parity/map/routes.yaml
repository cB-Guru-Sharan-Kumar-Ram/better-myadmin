# phpMyAdmin route → BetterMyAdmin endpoint(s) / SPA route(s). Keys are tools/parity/inventory/routes.json keys.
#   api: 'METHOD /api/…' (or a list)   ui: '/s/:s/…' (or a list)   later: targets still to build
#   planned: M<n> | exception: X<n> | n/a: <reason> | note: <text>
# Targets are verified against apps/server/src/routes (Hono) and apps/web/src/routes (TanStack) by
# pnpm parity:check; a route whose targets do not all exist must be `planned`. Placeholder SPA routes
# (rendering NotImplemented) do not count. docs/reference/pma-route-map.md is generated from this file.

