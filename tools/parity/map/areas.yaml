# Areas are the docs/features/NN-*.md files; "other" = cross-cutting or not a product feature.
# Used to group routes (by controller file), template controls, msgids and directives per area.
default: other
# Roadmap milestone per area (docs/architecture/13-roadmap-and-milestones.md)
