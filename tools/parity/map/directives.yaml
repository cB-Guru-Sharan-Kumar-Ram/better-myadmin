# Dispositions for phpMyAdmin directives our code does not read (yet). A directive that apps/ or
# packages/ (outside packages/config) reads is implemented whatever this file says.
# Keys: directive path (`Servers/*/host`) or a prefix ending in `/` or `*`.
#   planned: M<n> | exception: X<n> | n/a: <reason> | note: <text>

MemoryLimit:
  n/a: PHP memory_limit; Node has no per-request memory limit (exports and imports stream, X10/X9)
SessionSavePath:
  n/a: PHP session.save_path; sessions live in our SessionStore (DataDir / RedisUrl)
PersistentConnections:
  exception: X24
  note: connections are always pooled per session and server
ExecTimeLimit:
  exception: X9
  planned: M4
  note: no execution time limit in Node; the partial-import UI is kept
RecodingEngine:
  exception: X5
ShowPhpInfo:
  exception: X15
  planned: M1
SendErrorReports:
  exception: X19
  planned: M1
VersionCheck:
  exception: X20
  planned: M1
ThemeManager:
  exception: X16
  planned: M1
ThemeDefault:
  exception: X16
  planned: M1
ThemePerServer:
  exception: X16
  planned: M1

# Export / Import / Schema: the plugin options are named after the directives and take their
# defaults from $cfg[type][name] (Plugins::getDefault / checkboxCheck), the page settings are read
# by name; apps/server/test/int/directives-export-import.test.ts changes every one at once.
Export/:
  via:
    - packages/export/src/plugins
    - apps/server/src/export/page.ts
  note: option or page-setting name (Plugins::getDefault)
Import/:
  via:
    - packages/import/src/plugins
    - apps/server/src/import/page.ts
  note: option or page-setting name (Plugins::getDefault)
Schema/:
  via:
    - packages/schema/src/index.ts
    - apps/server/src/database/schema-export.ts
  note: option name (Plugins::getDefault, $cfg['Schema'])
Export/pdf_report_title:
  n/a: ExportPdf needs TCPDF, which the reference build does not ship either (no PDF export is offered)
Export/pdf_structure_or_data:
  n/a: ExportPdf needs TCPDF, which the reference build does not ship either (no PDF export is offered)
Schema/pdf_*:
  n/a: SchemaPdf needs TCPDF, which the reference build does not ship either (no PDF schema is offered)
Export/xml_export_struc:
  n/a: phpMyAdmin reads it nowhere (Settings only; ExportXml uses xml_structure_or_data)
Import/sql_read_as_multibytes:
  n/a: phpMyAdmin reads it nowhere but the Import settings form (Q12)

# Console: console/display.twig receives $cfg['Console'] (GET /console/config), the web console
# applies each key; apps/server/test/int/directives-server.test.ts.
Console/:
  via:
    - apps/server/src/routes/console.ts
    - apps/web/src/features/console
  note: settings.Console, read by key in the console (Console.setConfig)
ConsoleEnterExecutes:
  n/a: Header.php passes it to the page but no script reads it (Console/EnterExecutes is the setting)
LoginCookieValidityDisableWarning:
  n/a: HomeController only gates the warning that PHP's session.gc_maxlifetime is lower than LoginCookieValidity; no PHP session here
# SQLQuery: Generator::getMessage links; apps/server/test/unit/sql-message.test.ts
SQLQuery/:
  via: apps/server/src/query/message.ts
  note: cfg.SQLQuery read by key (Generator::getMessage)
# DefaultTransformations: TransformationsPlugin::getOptions($options, $cfg['DefaultTransformations'][name]);
# packages/mysql-types/test/transformation-defaults.test.ts
DefaultTransformations/:
  via: packages/mysql-types/src/transformations.ts
  note: defaults.<Plugin> (TransformationsPlugin::getOptions)
DefaultTransformations/External:
  exception: X4
DefaultTransformations/Inline/wrapper_link:
  n/a: filled at run time by the transformation wrapper URL, not a configuration value (the wrapper URL is built per cell)
DefaultTransformations/Inline/wrapper_params:
  n/a: filled at run time by the transformation wrapper URL, not a configuration value (the wrapper URL is built per cell)
