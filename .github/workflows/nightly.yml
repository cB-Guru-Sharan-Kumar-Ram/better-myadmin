name: nightly
# the long or rarely-changing suites kept out of the PR checks (ci.yml): run every night and on demand
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  # Full golden parity against a live reference phpMyAdmin (tests/parity/lib/target.ts), both targets.
  # Here rather than in per-push ci.yml: it starts a live reference and compares live output, which is
  # inherently flaky on shared 2-core runners (transient Docker Hub pulls, dropped HTTP/DB sockets).
  # The deterministic per-push parity guard is `parity-gate` in ci.yml (tools/parity vs the baseline).
  # retry: 2 (vitest.workspace.ts) and the socket guard (apps/server/test/support/socket-guard.ts)
  # still apply; a nightly re-run (workflow_dispatch) absorbs any residual transient flake.
  parity:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mysql
            services: mysql84 phpmyadmin-ref phpmyadmin-ref-i18n mysql84-replica phpmyadmin-ref-replica
          - target: mariadb
            services: mariadb11 phpmyadmin-ref-mariadb mariadb11-replica phpmyadmin-ref-mariadb-replica
    env:
      BMA_PARITY_TARGET: ${{ matrix.target }}
      # in compose networking the reference and the replica reach the primary by its service name and
      # port 3306; our app (on the runner) by the published port (tests/parity/server-replication)
      BMA_PARITY_REPLICA_SOURCE_HOST: ${{ matrix.target == 'mariadb' && 'mariadb11' || 'mysql84' }}
      BMA_PARITY_REPLICA_SOURCE_PORT: "3306"
    steps:
      - uses: actions/checkout@v4
      # optional: authenticate to Docker Hub if credentials are configured, to lift anonymous pull
      # rate limits on shared runners (a no-op when the secrets are absent)
      - name: Docker Hub login (if configured)
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin; else echo "no Docker Hub credentials; relying on pull retries"; fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.4, cache: pnpm }
      # PHP 8.3 with mbstring/iconv: the suites that start their own phpMyAdmin (pma-instance.ts,
      # pma-shadow.ts) and export-kanji's mbstring goldens run php on the runner (phpAvailable)
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "mysqli, mbstring, zip, iconv", coverage: none }
      # retry the build/up: the image build pulls composer:2 / php:8.3-cli and the DB images from
      # Docker Hub, which returns transient 5xx (and rate limits) on shared runners
      - name: docker compose up (with retry)
        run: |
          for i in 1 2 3; do
            docker compose -f docker/dev.compose.yml up -d --build --wait ${{ matrix.services }} && exit 0
            echo "::warning::docker compose up attempt $i failed (likely a transient Docker Hub error); retrying"
            docker compose -f docker/dev.compose.yml down -v || true
            sleep $((i * 20))
          done
          docker compose -f docker/dev.compose.yml logs || true
          exit 1
      # the reference checkout on the runner, from the built image: without it those suites would skip
      # (phpAvailable / canStartShadow guard on PMA_PATH / BMA_PARITY_PMA_ROOT), not run
      - name: Copy the reference checkout out of the phpmyadmin-ref image
        run: |
          ref=${{ matrix.target == 'mariadb' && 'phpmyadmin-ref-mariadb' || 'phpmyadmin-ref' }}
          docker compose -f docker/dev.compose.yml cp "$ref:/srv/pma" "$RUNNER_TEMP/pma"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/pma"
          echo "PMA_PATH=$RUNNER_TEMP/pma" >> "$GITHUB_ENV"
          echo "BMA_PARITY_PMA_ROOT=$RUNNER_TEMP/pma" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:parity

  # UI structure parity against MariaDB 11.4 and its reference phpMyAdmin (tests/ui-parity/lib/target.ts)
  ui-parity-mariadb:
    runs-on: ubuntu-24.04
    env:
      BMA_PARITY_TARGET: mariadb
      BMA_TEST_PORT: "3307"
      # phpmyadmin-ref-mariadb (docker/dev.compose.yml); without it global-setup would start a
      # private reference from a local checkout
      BMA_PARITY_PMA_URL: http://127.0.0.1:8084
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.4, cache: pnpm }
      # the private-instance ui-parity files (setup / auth types / i18n) start their own phpMyAdmin
      # from the reference checkout, as ci.yml's ui-parity job does
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "mysqli, mbstring, zip, iconv", coverage: none }
      - run: sudo python3 -m pip install --break-system-packages polib
      - run: docker compose -f docker/dev.compose.yml up -d --build --wait mariadb11 phpmyadmin-ref-mariadb
      - name: Copy the reference checkout out of the phpmyadmin-ref-mariadb image
        run: |
          docker compose -f docker/dev.compose.yml cp phpmyadmin-ref-mariadb:/srv/pma "$RUNNER_TEMP/pma"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/pma"
          echo "PMA_PATH=$RUNNER_TEMP/pma" >> "$GITHUB_ENV"
          echo "BMA_PARITY_PMA_ROOT=$RUNNER_TEMP/pma" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui-parity
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-parity-mariadb-results
          path: |
            .data/ui-parity-results
            .data/ui-parity
          if-no-files-found: ignore
