name: release
# A version tag (v1.0.0, …) publishes a release: the checks of ci.yml, the Docker image on GHCR
# (ghcr.io/<owner>/better-myadmin:<version> and :latest), and a GitHub release whose notes are the
# version's section of CHANGELOG.md. The tag must match the package version.
on:
  push: { tags: ["v*.*.*"] }

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: tag matches the package version
        run: |
          v="$(node -p "require('./apps/server/package.json').version")"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package $v"; exit 1; }
      - run: pnpm lint
      - run: pnpm conventions:check
      - run: pnpm i18n:parity
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @bettermyadmin/web build

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=GPL-2.0-or-later

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p = index($0, "## " v " ") == 1 || $0 == "## " v; next} p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG.md section for $v"; exit 1; }
      - name: GitHub release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release create "$GITHUB_REF_NAME" --title "BetterMyAdmin ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
