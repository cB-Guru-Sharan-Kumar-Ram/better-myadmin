name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # docs/architecture/16-golden-path.md: static, no database (tools/conventions)
      - run: pnpm conventions:check
      # every translated msgid is phpMyAdmin's (or annotated // i18n-new:), plural/context calls included
      - run: pnpm i18n:parity
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @bettermyadmin/web build

  # Parity ratchet (tools/parity): mapped/covered items, map targets, exception ids and inventory
  # freshness against tools/parity/baseline.json. Static: no database, no PHP. Never runs parity:baseline.
  parity-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm parity:check

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: ["mysql:8.4", "mysql:8.0", "mariadb:11.4", "mariadb:10.11"]
    services:
      db:
        image: ${{ matrix.db }}
        env: { MYSQL_ROOT_PASSWORD: root, MARIADB_ROOT_PASSWORD: root }
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -proot || healthcheck.sh --connect" --health-interval=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int

  # the same suites against each reference pair (tests/parity/lib/target.ts)
  parity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mysql
            services: mysql84 phpmyadmin-ref phpmyadmin-ref-i18n mysql84-replica phpmyadmin-ref-replica
          - target: mariadb
            services: mariadb11 phpmyadmin-ref-mariadb mariadb11-replica phpmyadmin-ref-mariadb-replica
    env:
      BMA_PARITY_TARGET: ${{ matrix.target }}
      # in compose networking the reference and the replica reach the primary by its service name and
      # port 3306; our app (on the runner) by the published port (tests/parity/server-replication)
      BMA_PARITY_REPLICA_SOURCE_HOST: ${{ matrix.target == 'mariadb' && 'mariadb11' || 'mysql84' }}
      BMA_PARITY_REPLICA_SOURCE_PORT: "3306"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: docker compose -f docker/dev.compose.yml up -d --build --wait ${{ matrix.services }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:parity

  # the browser suites (tests/e2e, tests/ui-parity) against the built SPA served by the real server,
  # in Playwright's Chromium; one suite per job, each run holding its MySQL lock (tests/e2e/suite-lock.ts)
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: e2e
            target: mysql
            # the replica for server-replica.e2e.ts
            services: mysql84 mysql84-replica
          - suite: e2e
            target: mariadb
            services: mariadb11
            port: "3307"
          - suite: ui-parity
            target: mysql
            services: mysql84 phpmyadmin-ref
    env:
      BMA_TEST_PORT: ${{ matrix.port || '3306' }}
      # the compose reference (phpmyadmin-ref, :8081): without it ui-parity's global-setup starts a
      # private reference from a local checkout and php, which a runner does not have
      BMA_PARITY_PMA_URL: http://127.0.0.1:8081
      # the replica reaches the primary by its service name (server-replica.e2e.ts restores it)
      BMA_PARITY_REPLICA_SOURCE_HOST: mysql84
      BMA_PARITY_REPLICA_SOURCE_PORT: "3306"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: docker compose -f docker/dev.compose.yml up -d --build --wait ${{ matrix.services }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:${{ matrix.suite }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-${{ matrix.target }}-results
          path: |
            .data/e2e-results
            .data/ui-parity-results
            .data/ui-parity
          if-no-files-found: ignore

  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: git clone --filter=blob:none --no-checkout https://github.com/phpmyadmin/phpmyadmin.git ../ref/pma
      - run: pnpm install --frozen-lockfile
      - run: pnpm upstream:check --gate
