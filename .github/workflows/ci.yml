name: ci
on:
  # the agents' integration branches too: without a pull request nothing else starts a run
  push: { branches: [main, "claude/**"] }
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # docs/architecture/16-golden-path.md: static, no database (tools/conventions)
      - run: pnpm conventions:check
      # every translated msgid is phpMyAdmin's (or annotated // i18n-new:), plural/context calls included
      - run: pnpm i18n:parity
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @bettermyadmin/web build

  # Parity ratchet (tools/parity): mapped/covered items, map targets, exception ids and inventory
  # freshness against tools/parity/baseline.json. Static: no database, no PHP. Never runs parity:baseline.
  parity-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm parity:check

  # the database started like docker/dev.compose.yml's mysql84 / mariadb11 (a services: container
  # takes neither server options nor the checkout's seeds): general log as a table, 1000 connections,
  # binary log on MariaDB, the pmadb `phpmyadmin` with control user pma/pmapass (the suites' STORAGE)
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: ["mysql:8.4", "mysql:8.0", "mariadb:11.4", "mariadb:10.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Start ${{ matrix.db }} with the dev seeds
        env: { DB_IMAGE: "${{ matrix.db }}" }
        run: |
          seed="$PWD/docker/seed"
          args="--general-log=1 --log-output=TABLE --max-connections=1000"
          mounts="-v $seed/00-general-log.sql:/docker-entrypoint-initdb.d/00-general-log.sql:ro
            -v $seed/pmadb.sql:/docker-entrypoint-initdb.d/01-pmadb.sql:ro
            -v $seed/02-replication-user.sql:/docker-entrypoint-initdb.d/02-replication-user.sql:ro"
          case "$DB_IMAGE" in mariadb*)
            # log-bin-trust-function-creators: with binary logging on, a non-SUPER user otherwise
            # cannot create/drop a trigger or function (#1419); matches docker/dev.compose.yml
            args="--server-id=11 --log-bin=mariadb-bin --log-bin-trust-function-creators=1 $args"
            mounts="$mounts -v $seed/03-mariadb-plugins.sql:/docker-entrypoint-initdb.d/03-mariadb-plugins.sql:ro" ;;
          esac
          # pre-pull with retry: Docker Hub returns transient 5xx under load on shared runners
          for i in 1 2 3; do docker pull "$DB_IMAGE" && break || { echo "pull $DB_IMAGE attempt $i failed; retrying"; sleep $((i * 15)); }; done
          docker run -d --name db -p 3306:3306 -e MYSQL_ROOT_PASSWORD=root -e MARIADB_ROOT_PASSWORD=root \
            $mounts "$DB_IMAGE" $args
          # TCP answers only once the entrypoint's init server (no networking) has run the seeds
          for i in $(seq 1 90); do
            docker exec db sh -c 'c=$(command -v mariadb || command -v mysql); "$c" -h127.0.0.1 -uroot -proot -e "SELECT 1"' \
              >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs db; exit 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int

  # NOTE: the live-reference parity jobs (parity mysql / mariadb) are intentionally NOT here. They
  # start a live reference phpMyAdmin and compare live output, which is inherently flaky on shared
  # 2-core runners (transient Docker Hub pulls, dropped HTTP/DB sockets), so they run in nightly.yml.
  # The deterministic parity guard for per-push CI is `parity-gate` above (tools/parity against the
  # saved baseline). See docs/architecture/14-development-setup.md#ci-tiers.

  # the browser suites (tests/e2e, tests/ui-parity) against the built SPA served by the real server,
  # in Playwright's Chromium; one suite per job, each run holding its MySQL lock (tests/e2e/suite-lock.ts)
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: e2e
            target: mysql
            # the replica for server-replica.e2e.ts and the "Dev replica" server of f01-servers.e2e.ts
            services: mysql84 mysql84-replica
            replicaSourceHost: mysql84
            replicaPort: "3308"
          - suite: e2e
            target: mariadb
            # same replica pair on MariaDB (mariadb11-replica :3309), so f01-servers and
            # server-replica run here too instead of failing / skipping
            services: mariadb11 mariadb11-replica
            port: "3307"
            replicaSourceHost: mariadb11
            replicaPort: "3309"
          - suite: ui-parity
            target: mysql
            services: mysql84 phpmyadmin-ref
            # the setup / auth-type / i18n ui-parity files start their own phpMyAdmin from a checkout
            needsCheckout: true
    env:
      BMA_TEST_PORT: ${{ matrix.port || '3306' }}
      # the compose reference (phpmyadmin-ref, :8081) serves the shared ui-parity cases
      BMA_PARITY_PMA_URL: http://127.0.0.1:8081
      # the dev replica (bma-replica.config.ts / server-replica.e2e.ts): its published port and the
      # service name it reaches the primary by, per target
      BMA_PARITY_REPLICA_PORT: ${{ matrix.replicaPort || '3308' }}
      BMA_PARITY_REPLICA_SOURCE_HOST: ${{ matrix.replicaSourceHost || 'mysql84' }}
      BMA_PARITY_REPLICA_SOURCE_PORT: "3306"
    steps:
      - uses: actions/checkout@v4
      # optional Docker Hub auth (no-op without secrets): lifts anonymous pull rate limits
      - name: Docker Hub login (if configured)
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin; else echo "no Docker Hub credentials; relying on pull retries"; fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # the three private-instance ui-parity files (setup / auth types / i18n) start their own
      # phpMyAdmin from the reference checkout, served by php on the runner (as the parity job does);
      # without it their beforeAll throws ENOENT on PMA_PATH and the whole suite does not run
      - if: matrix.needsCheckout
        uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "mysqli, mbstring, zip, iconv", coverage: none }
      # the i18n ui-parity file builds a translated reference instance (packages/i18n build-mo.py,
      # run as `python3 -I`, which ignores the user site — install polib into the system site via sudo)
      - if: matrix.needsCheckout
        run: sudo python3 -m pip install --break-system-packages polib
      # retry the build/up: Docker Hub returns transient 5xx (and rate limits) on shared runners
      - name: docker compose up (with retry)
        run: |
          for i in 1 2 3; do
            docker compose -f docker/dev.compose.yml up -d --build --wait ${{ matrix.services }} && exit 0
            echo "::warning::docker compose up attempt $i failed (likely a transient Docker Hub error); retrying"
            docker compose -f docker/dev.compose.yml down -v || true
            sleep $((i * 20))
          done
          docker compose -f docker/dev.compose.yml logs || true
          exit 1
      - if: matrix.needsCheckout
        name: Copy the reference checkout out of the phpmyadmin-ref image
        run: |
          docker compose -f docker/dev.compose.yml cp phpmyadmin-ref:/srv/pma "$RUNNER_TEMP/pma"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/pma"
          echo "PMA_PATH=$RUNNER_TEMP/pma" >> "$GITHUB_ENV"
          echo "BMA_PARITY_PMA_ROOT=$RUNNER_TEMP/pma" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:${{ matrix.suite }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-${{ matrix.target }}-results
          path: |
            .data/e2e-results
            .data/ui-parity-results
            .data/ui-parity
          if-no-files-found: ignore

  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: git clone --filter=blob:none --no-checkout https://github.com/phpmyadmin/phpmyadmin.git ../ref/pma
      - run: pnpm install --frozen-lockfile
      - run: pnpm upstream:check --gate
